# Deploys the Hugo site AND compiles questions/ -> data/**/questions.json
# (via @gurukulams/practice-js's build:questions script) into the same
# Pages artifact, so tag-filtering and any other question metadata make
# it to the live site.
#
# This intentionally does not call design-system's reusable
# material-deploy.yml. That workflow only runs `hugo --minify`, so it
# never (re)compiles the question data — this repo's own data/**/*.json
# was stuck on a build from before question_*.md files with `tags:` were
# added, because nothing regenerates it. Inlining the build here keeps
# this repo deployable even while the shared workflow is being iterated on.
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  HUGO_VERSION: '0.153.0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build Hugo site
        env:
          HUGO_PARAMS_GITHUBORG: ${{ github.repository_owner }}
        run: |
          git submodule add -f https://github.com/gurukulams/design-system themes/design-system
          REPO_NAME="/${GITHUB_REPOSITORY##*/}"
          HUGO_PARAMS_QUESTIONREPOSITORY="${REPO_NAME}_questions" hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Compile question data into ./public/data
        run: |
          export QUESTIONS_FOLDER="$PWD/questions"
          export PUBLIC_FOLDER="$PWD/public"
          git clone https://github.com/gurukulams/practice-js.git /tmp/practice-js
          cd /tmp/practice-js
          npm i
          npm run build:questions

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
